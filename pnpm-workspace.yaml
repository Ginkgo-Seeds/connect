packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@prisma/client-runtime-utils@7.9.1'
  - '@prisma/client@7.9.1'
  - '@prisma/config@7.9.1'
  - '@prisma/debug@7.9.1'
  - '@prisma/dev@0.24.17'
  - '@prisma/engines@7.9.1'
  - '@prisma/fetch-engine@7.9.1'
  - '@prisma/get-platform@7.9.1'
  - prisma@7.9.1

overrides:
  '@prisma/client': 7.9.1
  '@typescript/old': 'npm:typescript@6.0.2'
  '@types/node': 24.13.3
  fastify: 5.10.0
  next: 16.2.12
  prisma: 7.9.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 'npm:@typescript/typescript6@6.0.2'
  vitest: 4.1.10
