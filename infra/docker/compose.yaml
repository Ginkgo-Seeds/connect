services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ginkgo_connect}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-ginkgo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-postgres-admin-change-me}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-ginkgo_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-postgres-app-change-me}
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - connect_private
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-application-role.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - connect_private
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-change-me-now}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ginkgo_connect}
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - connect_private
    volumes:
      - minio_data:/data

networks:
  connect_private:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  redis_data:
